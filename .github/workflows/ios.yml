name: iOS

# ── WHY THIS EXISTS ────────────────────────────────────────────────────────────
# Four of the five members work on **Windows**. Xcode is macOS-only, so they cannot
# build, run or test anything locally — which means every Swift change they push is
# unverified. This workflow IS their build machine: it runs on GitHub's macOS runners
# and reports the result back on the pull request.
#
# The repository is public, so GitHub-hosted runners cost nothing and are unlimited,
# including the macOS ones. (macOS bills at 10x the Linux rate on private repos, which
# is the only reason this would be a problem — it is not one here.)
#
# ── WHY THE OUTPUT IS SHAPED THE WAY IT IS ─────────────────────────────────────
# The thing reading this is **an AI agent**, not a person watching a progress bar. So:
#   · every step prints a verdict that can be grepped
#   · the job writes a summary to $GITHUB_STEP_SUMMARY that survives the log being long
#   · failures are surfaced as GitHub annotations (xcbeautify's github-actions renderer)
#   · the raw xcodebuild log is uploaded as an artifact, so a failure can be read in full
#
# The commands an agent runs to fetch the verdict are in
# docs/18-WINDOWS-CONTRIBUTING.md. Do not change this file's output shape without
# updating that document.
#
# ── WHAT IS DELIBERATELY NOT HERE ──────────────────────────────────────────────
#   · No Firebase emulator. The test suite is hermetic — `grep -rl Firebase
#     ios/StudyForge/StudyForgeTests/` returns nothing — so nothing needs a network.
#   · No code signing. `CODE_SIGNING_ALLOWED=NO` builds for the Simulator, which is
#     the point; a signed build would need certificates this project does not have.

on:
  pull_request:
    branches: [develop, main]
  # Feature branches too, and this is not a nicety.
  #
  # WHY: a member pushed a branch that did NOT COMPILE and nothing looked at it. CI only ran
  # on pull requests, and he never opened one, so the failure was invisible — three types his
  # file referenced did not exist anywhere in the repository, and the first anyone knew was
  # when somebody built it by hand hours later. A red run 11 minutes after a push is a working
  # session. Silence is a lost afternoon, and it is the failure mode the whole workflow exists
  # to prevent for the members who cannot build locally at all.
  #
  # THE COST, measured rather than assumed: a commit with both a push run and a pull-request run
  # produces TWO workflow runs, so this doubles the macOS jobs while a branch has an open PR —
  # and `gh pr checks` shows each job TWICE, once per run:
  #
  #     $ gh pr checks 124 --json name,event
  #       iOS build and test   IN_PROGRESS  event=push
  #       Repo checks          SUCCESS      event=push
  #       iOS build and test   IN_PROGRESS  event=pull_request
  #       Repo checks          SUCCESS      event=pull_request
  #
  # The `event` field is what keeps that readable rather than confusing, and a red row from
  # EITHER run means the commit is broken. The minutes are free on a public repository, and
  # `concurrency` still cancels superseded runs within a ref, so the real cost is queue depth.
  #
  # DO NOT "fix" that by widening the concurrency group to cancel across the two events. It
  # would halve the runs and be worse: a *cancelled* run reads as a failure to the AI agent
  # reading `gh pr checks`, whereas a duplicate pass reads as what it is. Trading a harmless
  # extra run for an ambiguous red is the wrong way round.
  push:
    branches:
      - develop
      - main
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'chore/**'
      - 'release/**'
      - 'hotfix/**'
  workflow_dispatch:

# A new push to the same branch cancels the previous run. On a 5-person team pushing
# daily, that is the difference between a queue and a result.
concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Fast: everything that does not need a Mac ────────────────────────────────
  # Runs in seconds, so a Windows member gets doc and lane feedback long before the
  # ~10 minute macOS build finishes.
  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # check-release compares main against develop

      # ── The log-level rules, where they cannot be skipped ──────────────────
      # See tools/check-commits.sh for what it refuses and why. Three details matter here:
      #
      #   · IT RUNS FIRST, BEFORE `check-release`. That is not stylistic. The release step fetches
      #     `main` and `develop` with `--depth=1`, which makes this checkout SHALLOW and turns
      #     `origin/develop` into a grafted boundary with no parents — and a range measured from a
      #     boundary commit is not "what this branch brings", it is the whole repository.
      #     **Measured on this check's first three runs: 1345, then 14, then 1348 commits judged
      #     against a branch that has 13.** The shallow guard below makes the step safe wherever it
      #     is placed; the ordering keeps it honest as well.
      #   · `--rules-ref` makes the BASE branch's rules judge the branch — its message pattern,
      #     its allowlist, its lane guard and its `.mailmap`. Without it, the pull request that
      #     changed a rule would be the one deciding whether it applies.
      #   · the range is `origin/$BASE..HEAD` from the FRESHLY FETCHED base tip, never from
      #     `github.event.pull_request.base.sha`. That SHA is the base as it was when the pull
      #     request was OPENED, so a range from it sweeps in everything develop gained since —
      #     including pull-request merge commits, which are authored by GitHub and are nobody's
      #     work. Also measured: run 2 failed on `196bf0b`, the merge commit of PR #130.
      #
      # This is the check that would have caught `feat/F03-AI-SUMMARY` on the day it was pushed:
      # five subjects that are not Conventional Commits, a personal author address, and — once a
      # PR exists — an out-of-lane file. It exists because tools/commit.sh and tools/check-lane.sh
      # are LOCAL tools, and a member who never runs them was contradicted by nothing at all
      # (docs/12 §3.1: a rule that can be silently bypassed is not a rule).
      - name: Commit hygiene (identity, message, lane)
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # `set -e` matters: without it a failed fetch is invisible and the range silently
          # becomes something other than this branch. The tool refuses an implausible range as
          # well, so this cannot fail quietly in either direction.
          set -euo pipefail
          if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
            echo "::warning::checkout is shallow — unshallowing so the range means what it says"
            git fetch --unshallow --no-tags origin 2>/dev/null || true
          fi
          BASE="${BASE_REF:-develop}"
          git fetch --no-tags origin "refs/heads/$BASE:refs/remotes/origin/$BASE"
          echo "origin/$BASE resolves to $(git rev-parse --short "origin/$BASE")"
          if [ -n "$BASE_REF" ]; then
            RANGE="origin/$BASE..HEAD"
            BRANCH="$HEAD_REF"
          else
            RANGE="$(git merge-base "origin/$BASE" HEAD)..HEAD"
            BRANCH="$REF_NAME"
          fi
          echo "judging $RANGE — $(git rev-list --no-merges --count "$RANGE") non-merge commits on '$BRANCH'"
          bash tools/check-commits.sh --range "$RANGE" --branch "$BRANCH" --rules-ref "origin/$BASE"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Documentation and ownership integrity
        run: python3 tools/verify-docs.py

      - name: English and Arabic string parity
        run: python3 tools/check-strings.py

      - name: Colour-token parity
        run: bash tools/check-tokens.sh

      # ── The payment rules, where they cannot be skipped either ─────────────
      # Until this step existed, `tsc --noEmit` was the bar for `backend/functions` and the payment
      # logic — the signature check, the price resolution, the VAT arithmetic, the idempotency rule,
      # the refund precondition — was provable only by reading it.
      #
      # `npm test` compiles and runs Node's OWN test runner: no new dependency, no Firebase
      # project, no credentials, no network. It catches the two classes of bug that reading does
      # not — the arithmetic (VAT is inclusive, so the tax inside a 1.900 total is 173 fils, not
      # 190) and the CONTRACT between the Swift price table and this one, which no compiler sees.
      #
      # Node 22 is pinned rather than inherited from the runner because `engines.node` says 22 and
      # the runner's default drifts: a test suite that depends on the image's Node is a suite that
      # goes red for a reason unrelated to the change.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      - name: Cloud Functions payment rules
        run: |
          set -euo pipefail
          cd backend/functions
          npm ci --no-audit --no-fund
          npm test

      - name: main has not structurally drifted from develop
        run: |
          git fetch origin main develop --depth=1 2>/dev/null || true
          bash tools/check-release.sh

  # ── The build machine ────────────────────────────────────────────────────────
  ios:
    name: iOS build and test
    runs-on: macos-26                 # macOS 26 + Xcode 26 → the iOS 26 SDK this project needs
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Record the toolchain
        run: |
          echo "xcodebuild : $(xcodebuild -version | head -1)"
          echo "--- iOS SDKs ---"
          xcodebuild -showsdks | grep -i 'ios' || true
          echo "--- iOS runtimes ---"
          xcrun simctl list runtimes | grep -i 'ios' || true

      # Firebase iOS SDK pulls 13 packages including binary gRPC and abseil frameworks.
      # Cold resolution is minutes; cached is seconds. Keyed on Package.resolved so a
      # dependency change correctly invalidates it.
      - name: Cache Swift Package checkouts
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/StudyForge/StudyForge.xcodeproj \
            -scheme StudyForge

      # The runner's simulator list is not guaranteed to match a developer's Mac, so the device
      # is discovered rather than hard-coded. The **UDID** is used, not the name: a name like
      # "iPhone 17" exists on several runtimes and `xcodebuild -destination` rejects the ambiguity
      # with "Unable to find a device matching the provided destination specifier". A UDID always
      # resolves. The name is kept only for the human-readable summary.
      - name: Choose an available iPhone simulator
        id: sim
        run: |
          PICKED=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS"))
                      | .value[] | select(.name | test("^iPhone"))] | last')
          UDID=$(printf '%s' "$PICKED" | jq -r '.udid')
          NAME=$(printf '%s' "$PICKED" | jq -r '.name')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "::error::no iPhone simulator found on this runner"
            xcrun simctl list devices available | head -40
            exit 1
          fi
          echo "udid=$UDID"  >> "$GITHUB_OUTPUT"
          echo "name=$NAME"  >> "$GITHUB_OUTPUT"
          echo "Using simulator: $NAME ($UDID)"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project ios/StudyForge/StudyForge.xcodeproj \
            -scheme StudyForge \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/build.log | xcbeautify

      - name: Test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project ios/StudyForge/StudyForge.xcodeproj \
            -scheme StudyForge \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee /tmp/test.log | xcbeautify --renderer github-actions

      # The agent's primary signal. Written to the job summary so it survives a long log.
      - name: Summarise the result
        if: always()
        run: |
          {
            echo "## iOS build and test"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Xcode | \`$(xcodebuild -version | head -1)\` |"
            echo "| Simulator | \`${{ steps.sim.outputs.name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "### Test result"
            echo ""
            echo '```'
            grep -E 'Test run with|Executed [0-9]+ tests?' /tmp/test.log 2>/dev/null | tail -4 \
              || echo 'no test summary line found — the build may have failed before testing'
            echo '```'
            FAILURES=$(grep -cE '^✘|error:|failed' /tmp/test.log 2>/dev/null || echo 0)
            if [ "${FAILURES:-0}" -gt 0 ]; then
              echo ""
              echo "### Failures (first 25 lines)"
              echo ""
              echo '```'
              grep -E '^✘|error:|Failing|failed' /tmp/test.log 2>/dev/null | head -25 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the raw log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            /tmp/test.log
            /tmp/build.log
          if-no-files-found: ignore
          retention-days: 14

      # continue-on-error above lets the summary and artifact steps run even when tests
      # fail. This is what actually fails the job, so the PR gets a red X.
      - name: Fail the job if the tests failed
        if: steps.test.outcome == 'failure'
        run: |
          echo "::error::the test suite failed — see the job summary and the xcodebuild-log artifact"
          exit 1
